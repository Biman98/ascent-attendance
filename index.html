*{margin:0;padding:0;box-sizing:border-box}

input,select{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px;margin-bottom:11px;outline:none;font-family:inherit;-webkit-appearance:none}
input::placeholder{color:#7d8590}
select{-webkit-appearance:auto;appearance:auto}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:none;text-align:center;-webkit-tap-highlight-color:transparent;transition:opacity .2s}

.bp{background:#00d4aa;color:#0c1117}.bs{background:transparent;color:#7d8590;border:1px solid #30363d}
.card{background:#161b22;border-radius:14px;padding:16px;border:1px solid #30363d;margin-bottom:12px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;color:#e6edf3;padding:12px 24px;border-radius:12px;border:1px solid #00d4aa;z-index:999;font-size:14px;opacity:0;transition:all .3s;white-space:nowrap;max-width:90%}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#161b22;border-top:1px solid #30363d;display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,12px);z-index:100}
.nav button{background:none;border:none;color:#7d8590;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.nav button.on{color:#00d4aa}
.nav button i{font-size:20px;font-style:normal}
.att-btn{padding:20px;border-radius:16px;cursor:pointer;text-align:center;border:none;width:100%;margin-bottom:12px}
.att-btn:active{transform:scale(.97)}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px}
.spin{width:40px;height:40px;border:3px solid #30363d;border-top-color:#00d4aa;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes salPulse{0%,100%{box-shadow:0 0 8px #00d4aa22}50%{box-shadow:0 0 20px #00d4aa44,0 0 40px #00d4aa11}}
@keyframes sparkle{0%,100%{opacity:.7;text-shadow:0 0 4px #fbbf2444}50%{opacity:1;text-shadow:0 0 12px #fbbf24,0 0 24px #fbbf2466,0 0 36px #fbbf2433}}
@keyframes starFloat{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.1)}100%{transform:translateY(0) scale(1)}}
@media(prefers-color-scheme:light){html,body{background:#0c1117!important;color:#e6edf3!important}}
</style>

function fd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function csun(y,m){var c=0;for(var d=1;d<=dim(y,m);d++)if(new Date(y,m,d).getDay()===0)c++;return c;}
function geoD(a,b){var R2=6371e3,toR=function(x){return x*Math.PI/180;};var dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return R2*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},3000);}

function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

function loadAll(cb){
var done=0;function chk(){done++;if(done>=4){loaded=true;if(cb)cb();}}
empRef.orderBy('name').get().then(function(s){E=[];s.forEach(function(d){var o=d.data();o.id=d.id;E.push(o);});chk();}).catch(function(){chk();});
setRef.get().then(function(d){if(d.exists){var o=d.data();S.lat=o.lat||S.lat;S.lng=o.lng||S.lng;S.radius=o.radius||S.radius;S.adminPwd=o.adminPwd||S.adminPwd;if(o.cutoffHr!==undefined)S.cutoffHr=o.cutoffHr;if(o.cutoffMin!==undefined)S.cutoffMin=o.cutoffMin;}chk();}).catch(function(){chk();});
recRef.where('date','==',fd()).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});chk();}).catch(function(){chk();});
loadLateAllows(chk);
}

function loadLateAllows(cb){
db.collection('lateAllow').where('date','==',fd()).get().then(function(s){LATE={};s.forEach(function(d){var o=d.data();LATE[o.empId]=o.allowed;});if(cb)cb();}).catch(function(){if(cb)cb();});
}

function loadRecsDate(dt,cb){recRef.where('date','==',dt).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});if(cb)cb();}).catch(function(){if(cb)cb();});}

function loadRecsMonth(y,m,cb){
var s2=y+'-'+String(m+1).padStart(2,'0')+'-01',e2=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dim(y,m)).padStart(2,'0');
recRef.where('date','>=',s2).where('date','<=',e2).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});
adjRef.where('month','==',String(m+1).padStart(2,'0')).where('year','==',String(y)).get().then(function(as){as.forEach(function(ad){var ao=ad.data();ao._id=ad.id;ADJ[ao.empId+'_'+y+'_'+m]=ao;});if(cb)cb();}).catch(function(){if(cb)cb();});
}).catch(function(){if(cb)cb();});
}

var mode=null,pg='dash',sStep='sel',selE=null,pin='',eId=null,attD=fd(),salM=new Date().getMonth(),salY=new Date().getFullYear();
var viewEmpId=null; // for individual attendance view
var app=document.getElementById('app');

function sortedE(){var m=[],d=[];for(var i=0;i<E.length;i++){if(E[i].salaryType==='daily')d.push(E[i]);else m.push(E[i]);}return m.concat(d);}
function catHeader(type){return '<div style="padding:8px 0;margin-top:8px;margin-bottom:4px;border-bottom:2px solid '+(type==='monthly'?'#00d4aa33':'#fbbf2433')+'"><span style="font-size:13px;font-weight:700;color:'+(type==='monthly'?'#00d4aa':'#fbbf24')+'">'+(type==='monthly'?'📅 Monthly Staff':'📆 Daily Staff')+'</span></div>';}

if(!loaded){app.innerHTML='<div class="loading"><div class="spin"></div><p style="color:#7d8590;font-size:13px">Firebase loading...</p></div>';return;}

app.innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:#0c1117">'+

/* ===== STAFF MODE ===== */
function rStaff(){
document.getElementById('adminNav').style.display='none';
var today=fd();
var h='<div style="padding:16px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px"><button id="sBack" style="background:none;border:none;color:#7d8590;font-size:22px;cursor:pointer">←</button><div><div style="font-size:17px;font-weight:600;color:#e6edf3">👤 Staff Attendance</div>'+(selE?'<div style="color:#00d4aa;font-size:12px">'+selE.name+'</div>':'')+'</div></div>';

if(sStep==='sel'){
h+='<div style="padding:24px 20px"><h2 class="df" style="font-size:20px;margin-bottom:4px;color:#e6edf3">Apnar Naam Select Korun</h2><p style="color:#7d8590;font-size:13px;margin-bottom:20px">'+bn()+'</p>';
if(!E.length)h+='<p style="color:#7d8590;text-align:center;margin-top:40px">Admin ke bolun employee add korte</p>';
else{var sE=sortedE(),lastType='';
for(var i=0;i<sE.length;i++){var e=sE[i],rec=R[e.id+'_'+today],st=rec?(rec.status==='present'?'✅':rec.status==='half'?'🕐':'❌'):'';

h+='<button data-i="'+e.id+'" class="eS" style="width:100%;padding:16px;margin-bottom:10px;border-radius:14px;border:1px solid #30363d;background:#161b22;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left"><div style="width:44px;height:44px;border-radius:12px;background:#00d4aa22;display:flex;align-items:center;justify-content:center;color:#00d4aa;font-weight:700;font-size:18px">'+e.name[0].toUpperCase()+'</div><div style="flex:1"><div style="color:#e6edf3;font-size:15px;font-weight:600">'+e.name+'</div></div><span style="font-size:18px">'+st+'</span></button>';}}
h+='</div>';
}else if(sStep==='pin'){
h+='<div style="padding:24px 20px;text-align:center"><div style="width:72px;height:72px;border-radius:20px;background:#00d4aa22;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#00d4aa">'+selE.name[0].toUpperCase()+'</div><h2 class="df" style="font-size:20px;margin-bottom:4px;color:#e6edf3">'+selE.name+'</h2><p style="color:#7d8590;font-size:13px;margin-bottom:28px">4-digit PIN deen</p><div style="display:flex;justify-content:center;gap:12px;margin-bottom:24px">';
for(var d=0;d<4;d++)h+='<div style="width:48px;height:56px;border-radius:12px;border:2px solid '+(pin.length>d?'#00d4aa':'#30363d')+';background:'+(pin.length>d?'#00d4aa22':'#161b22')+';display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#00d4aa">'+(pin[d]?'●':'')+'</div>';
h+='</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:280px;margin:0 auto">';
var nums=[1,2,3,4,5,6,7,8,9,'',0,'del'];
for(var n=0;n<nums.length;n++){if(nums[n]==='')h+='<div></div>';else h+='<button class="nB" data-v="'+nums[n]+'" style="padding:16px;font-size:22px;font-weight:600;border-radius:14px;border:1px solid #30363d;background:#161b22;color:#e6edf3;cursor:pointer">'+(nums[n]==='del'?'⌫':nums[n])+'</button>';}
h+='</div><button id="vBtn" class="btn bp" style="margin-top:20px;opacity:'+(pin.length===4?1:.5)+'">Verify →</button></div>';
}else if(sStep==='mark'){
var key=selE.id+'_'+today,rec=R[key];
var cutoff=S.cutoffHr||11,cutoffMin=S.cutoffMin||10;
var now=new Date(),isLate=now.getHours()>cutoff||(now.getHours()===cutoff&&now.getMinutes()>=cutoffMin);
var cutoffStr=String(cutoff).padStart(2,'0')+':'+String(cutoffMin).padStart(2,'0');
var adminAllowed=LATE[selE.id]||false;
if(adminAllowed)isLate=false;
var isAutoAbsent=rec&&rec.status==='absent'&&rec.punchIn&&rec.punchIn.indexOf('Auto-Absent')!==-1;
if(adminAllowed&&isAutoAbsent&&rec._id){
recRef.doc(rec._id).delete().then(function(){delete R[key];render();});
h+='<div class="loading"><div class="spin"></div><p style="color:#7d8590">Preparing...</p></div></div>';
}else{
var showRec=rec&&!isAutoAbsent;
h+='<div style="padding:24px 20px;text-align:center"><div style="font-size:14px;color:#7d8590;margin-bottom:6px">'+bn()+'</div><div class="df" style="font-size:36px;font-weight:700;margin-bottom:4px;color:#e6edf3">'+timeNow()+'</div><div style="color:#00d4aa;font-size:13px;margin-bottom:6px">📍 Geo-fence: '+S.radius+'m</div><div style="color:#7d8590;font-size:11px;margin-bottom:24px">⏰ Deadline: '+cutoffStr+(adminAllowed?' <span style=color:#10b981>✅ Admin Allowed</span>':'')+'</div>';
if(showRec){var col=rec.status==='present'?'#10b981':rec.status==='half'?'#fbbf24':rec.status==='early'?'#f97316':'#ff6b6b',bg=rec.status==='present'?(rec.earlyTime?'#f9731622':'#10b98122'):rec.status==='half'?'#fbbf2422':rec.status==='early'?'#f9731622':'#ff6b6b22';
if(rec.earlyTime){col='#f97316';bg='#f9731622';}
h+='<div style="padding:24px;border-radius:20px;margin-bottom:20px;background:'+bg+';border:1px solid '+col+'44"><div style="font-size:48px">'+(rec.earlyHrs?'🚪':rec.status==='present'?'✅':rec.status==='half'?'🕐':'❌')+'</div><div style="font-size:18px;font-weight:700;margin-top:8px;color:'+col+'">'+(rec.earlyHrs?'Present + Early Leave ('+rec.earlyHrs+'hr)':rec.status==='present'?'Present':rec.status==='half'?'Half Day':'Absent')+'</div><div style="color:#7d8590;font-size:13px;margin-top:4px">Ajker attendance deoa hoye geche</div><div style="color:#7d8590;font-size:12px;margin-top:6px">In: '+(rec.punchIn||'-')+(rec.earlyHrs?' | EL: '+rec.earlyHrs+'hr @ '+rec.earlyTime:'')+'</div></div>';
if(rec.status==='present'&&!rec.earlyHrs)h+='<div style="margin-top:12px"><div style="color:#f97316;font-size:13px;font-weight:600;margin-bottom:8px">🚪 Early Leave?</div><div style="display:flex;gap:8px;align-items:center"><input id="elH" type="number" min="0" max="8" placeholder="Hours" style="margin:0;padding:10px;font-size:14px;flex:1"><input id="elM" type="number" min="0" max="59" placeholder="Min" style="margin:0;padding:10px;font-size:14px;flex:1"><button id="earlyBtn" class="btn bp" style="width:auto;padding:10px 16px;font-size:13px">Submit</button></div><div style="color:#7d8590;font-size:10px;margin-top:4px">Koto ghonta agee chole jacchen? (jemon: 2 hr 30 min)</div></div>';
if(rec.earlyHrs){var elDed=rec.earlyHrs;h+='<div style="margin-top:12px;padding:12px;border-radius:12px;background:#f9731615;border:1px solid #f9731633"><div style="color:#f97316;font-size:13px;font-weight:600">🚪 Early Leave: '+elDed+' hrs deducted</div><div style="color:#7d8590;font-size:11px;margin-top:2px">Worked '+(8-elDed)+' hrs out of 8 hrs</div></div>';}
}else if(isLate){
h+='<div style="padding:24px;border-radius:20px;margin-bottom:20px;background:#ff6b6b22;border:1px solid #ff6b6b44"><div style="font-size:48px">⛔</div><div style="font-size:18px;font-weight:700;margin-top:8px;color:#ff6b6b">Time Over!</div><div style="color:#7d8590;font-size:13px;margin-top:4px">'+cutoffStr+' er modhye attendance dite hoto</div><div style="color:#7d8590;font-size:12px;margin-top:6px">Admin ke bolun jodi special permission dorkar</div></div>';
var absData={empId:selE.id,empName:selE.name,date:fd(),status:'absent',punchIn:'Auto-Absent ('+cutoffStr+')',punchOut:'',ts:firebase.firestore.FieldValue.serverTimestamp()};

h+='<button id="mH" class="att-btn" style="background:#fbbf2422;border:1px solid #fbbf2444"><div style="font-size:36px">🕐</div><div style="font-size:17px;font-weight:700;color:#fbbf24;margin-top:6px">Half Day</div></button>';}
}
// SALARY TILL DATE - using calcSal for consistency
var cm=new Date().getMonth(),cy=new Date().getFullYear();
var staffSal=calcSal(selE,cy,cm);

/* ===== CALC SALARY ===== */
function calcSal(e,y,m){
var totalDays=dim(y,m);
var pr2=0,hf2=0,ab2=0,sun=csun(y,m),td=new Date();
// Count Sundays till today for paid leave (monthly staff only)
var paidSundays=0;
for(var d=1;d<=totalDays;d++){
var isToday=new Date(y,m,d)<=td;
if(new Date(y,m,d).getDay()===0){
// Monthly staff get Sunday as paid leave
if(e.salaryType==='monthly'&&isToday)paidSundays++;
continue;
}
var dt=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
var rec2=R[e.id+'_'+dt];
if(rec2){if(rec2.status==='present'){
// Check early leave hours
if(rec2.earlyHrs){var worked=8-rec2.earlyHrs;pr2+=Math.max(0,Math.round((worked/8)*100)/100);}
else pr2++;
}else if(rec2.status==='half')hf2++;else if(rec2.status==='early'){hf2++;}else ab2++;}
else if(isToday)ab2++;
}
var adjKey=e.id+'_'+y+'_'+m;
var adj=ADJ[adjKey]||{overtime:0,fine:0};
var ot=parseFloat(adj.overtime)||0;
var fine=parseFloat(adj.fine)||0;
var otPaid=adj.otPaid||false;
// Monthly: effective = present + half*0.5 + paid sundays
// Daily: effective = present + half*0.5 (no sunday pay)
var eff=pr2+hf2*0.5;
var effWithSun=eff+paidSundays;
var base=e.salaryType==='monthly'?Math.round((e.salary/30)*effWithSun):Math.round(e.dailyRate*eff);
// If OT paid separately, don't add to net salary
var netOt=otPaid?0:ot;
var net=base+netOt-fine;
return {present:pr2,half:hf2,absent:ab2,effective:eff,effWithSun:effWithSun,paidSundays:paidSundays,base:base,overtime:ot,otPaid:otPaid,fine:fine,net:Math.max(0,net),sundays:sun,totalDays:totalDays};
}

var area=document.getElementById('eFA');if(!area)return;
var ftype=e.salaryType||'monthly';
area.innerHTML='<div class="card" style="border-color:#00d4aa44"><input id="fn" placeholder="Naam" value="'+e.name+'"><input id="fp" placeholder="Phone" value="'+(e.phone||'')+'"><input id="fpi" placeholder="4-digit PIN" maxlength="4" value="'+(e.pin||'')+'"><div style="display:flex;gap:8px;margin-bottom:12px"><button id="tM" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='monthly'?'#00d4aa':'#30363d')+';background:'+(ftype==='monthly'?'#00d4aa22':'transparent')+';color:'+(ftype==='monthly'?'#00d4aa':'#7d8590')+'">📅 Monthly</button><button id="tD" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='daily'?'#00d4aa':'#30363d')+';background:'+(ftype==='daily'?'#00d4aa22':'transparent')+';color:'+(ftype==='daily'?'#00d4aa':'#7d8590')+'">📆 Daily</button></div><input id="fsa" type="number" placeholder="Monthly Salary (₹)" value="'+(e.salary||'')+'" style="display:'+(ftype==='daily'?'none':'block')+'"><input id="fda" type="number" placeholder="Daily Rate (₹)" value="'+(e.dailyRate||'')+'" style="display:'+(ftype==='daily'?'block':'none')+'"><div style="display:flex;gap:8px"><button id="svE" class="btn bp">'+(eId?'Update':'Save')+' ✅</button><button id="cnE" class="btn bs" style="width:auto;padding:14px 20px">Cancel</button></div></div>';

document.getElementById('tM').onclick=function(){ftype='monthly';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tD').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fsa').style.display='block';document.getElementById('fda').style.display='none';};
document.getElementById('tD').onclick=function(){ftype='daily';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tM').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fda').style.display='block';document.getElementById('fsa').style.display='none';};

document.getElementById('svE').onclick=function(){
var name=document.getElementById('fn').value.trim(),phone=document.getElementById('fp').value.trim(),pinV=document.getElementById('fpi').value;
var sal=parseFloat(document.getElementById('fsa').value)||0,daily=parseFloat(document.getElementById('fda').value)||0;
if(!name)return showToast('Naam likhun!');if(!pinV||pinV.length!==4)return showToast('4 digit PIN deen!');
var data={name:name,phone:phone,salaryType:ftype,salary:sal,dailyRate:daily,pin:pinV};
showToast('💾 Saving...');
if(eId){empRef.doc(eId).update(data).then(function(){for(var i=0;i<E.length;i++)if(E[i].id===eId){data.id=eId;E[i]=data;break;}showToast('✅ Updated!');eId=null;render();}).catch(function(){showToast('Error!');});}
else{empRef.add(data).then(function(doc){data.id=doc.id;E.push(data);showToast('✅ Added!');eId=null;render();}).catch(function(){showToast('Error!');});}};
document.getElementById('cnE').onclick=function(){eId=null;render();};
}

loadAll(function(){render();});
})();
</script>
</body>
</html>
