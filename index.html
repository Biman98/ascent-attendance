}
var DEFAULT_AGR={
editor:genTemplate('ভিডিও এডিটর','আমি সময়মতো ও এডিট-ব্রিফ অনুযায়ী ভিডিও ডেলিভার করব এবং কাঁচা ফুটেজ ও প্রজেক্ট ফাইল গোপন রাখব।'),
actor:genTemplate('অভিনেতা/অভিনেত্রী','আমি শুটিং শিডিউল মেনে চলব এবং কোম্পানির কনটেন্টে আমার অভিনয় ব্যবহারের পূর্ণ অধিকার কোম্পানিকে দেব।'),
dop:genTemplate('DOP / ক্যামেরা','আমি শুটিং সরঞ্জাম যত্নসহকারে ব্যবহার করব এবং ধারণকৃত সমস্ত ফুটেজ কোম্পানির সম্পত্তি হিসেবে রাখব।'),
other:genTemplate('অন্যান্য কর্মী','আমি আমার উপর অর্পিত সকল দায়িত্ব নিষ্ঠার সাথে, সময়মতো ও কোম্পানির নির্দেশ অনুযায়ী পালন করব এবং কোম্পানির সম্পত্তি ও তথ্য যত্নসহকারে রক্ষা করব।')
};
function getRoleTemplate(role){
var t=S.agreementTemplates||{};
if(role==='actor'){
if(t.actor&&t.actor.trim())return t.actor;
return DEFAULT_AGR.actor;
}
/* editor, dop, other -> ek merged "Anyanno kormi" chukti */
if(t.other&&t.other.trim())return t.other;
return DEFAULT_AGR.other;
}
function roleLabel(r){return r==='editor'?'ভিডিও এডিটর':r==='actor'?'অভিনেতা/অভিনেত্রী':r==='dop'?'DOP / ক্যামেরা':'কর্মী';}
function simpleHash(str){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i);h=h&0xffffffff;}return (h>>>0).toString(16);}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function fd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function csun(y,m){var c=0;for(var d=1;d<=dim(y,m);d++)if(new Date(y,m,d).getDay()===0)c++;return c;}
function geoD(a,b){var R2=6371e3,toR=function(x){return x*Math.PI/180;};var dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return R2*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},3000);}
function bn(){try{return new Date().toLocaleDateString('bn-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return fd();}}
function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
var mn=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ===================== DATA LAYER ===================== */
function noop(){}
function pad2(n){return String(n).padStart(2,'0');}
function empById(id){for(var i=0;i<E.length;i++)if(E[i].id===id)return E[i];return null;}
function fmtINR(n){return (Math.round((parseFloat(n)||0)*100)/100).toLocaleString('en-IN');}

/* --- Attendance record: ek staff-er ek dine ekta-i record dhora hoy --- */
function isAutoAbs(o){return !!o&&o.status==='absent'&&(o.auto===true||String(o.punchIn||'').indexOf('Auto-Absent')===0);}
function putRec(o){
if(!o||!o.empId||!o.date)return;
var k=o.empId+'_'+o.date,ex=R[k];
if(ex&&ex._id&&o._id&&ex._id!==o._id){
var exA=isAutoAbs(ex),nA=isAutoAbs(o);
/* Staff/Admin-er real record thakle, oi diner duplicate auto-absent muche dei */
if(nA&&!exA){recRef.doc(o._id).delete().catch(noop);return;}
if(exA&&!nA){recRef.doc(ex._id).delete().catch(noop);}
}
R[k]=o;
}
function dropRecs(fn){for(var k in R){if(R[k]&&fn(R[k]))delete R[k];}}
function fillRecs(snap){snap.forEach(function(d){var o=d.data();o._id=d.id;putRec(o);});}
function putAdj(d){var o=d.data();o._id=d.id;var yy=parseInt(o.year,10),mm=parseInt(o.month,10)-1;if(!o.empId||isNaN(yy)||isNaN(mm))return;ADJ[o.empId+'_'+yy+'_'+mm]=o;}

function loadAll(cb){
var done=0;function chk(){done++;if(done>=4){loaded=true;if(cb)cb();}}
empRef.orderBy('name').get().then(function(s){E=[];s.forEach(function(d){var o=d.data();o.id=d.id;E.push(o);});chk();}).catch(function(){chk();});
setRef.get().then(function(d){if(d.exists){var o=d.data();S.lat=o.lat||S.lat;S.lng=o.lng||S.lng;S.radius=o.radius||S.radius;S.adminPwd=o.adminPwd||S.adminPwd;if(o.cutoffHr!==undefined)S.cutoffHr=o.cutoffHr;if(o.cutoffMin!==undefined)S.cutoffMin=o.cutoffMin;if(o.agreementTemplates)S.agreementTemplates=o.agreementTemplates;if(o.coc)S.coc=o.coc;}chk();}).catch(function(){chk();});
loadRecsDate(fd(),chk);
loadLateAllows(chk);
setTimeout(function(){if(!loaded){loaded=true;if(cb)cb();else render();}},6000);
}

function loadLateAllows(cb){
db.collection('lateAllow').where('date','==',fd()).get().then(function(s){LATE={};s.forEach(function(d){var o=d.data();LATE[o.empId]=o.allowed;});if(cb)cb();}).catch(function(){if(cb)cb();});
}

function loadRecsDate(dt,cb){recRef.where('date','==',dt).get().then(function(s){dropRecs(function(o){return o.date===dt;});fillRecs(s);if(cb)cb();}).catch(function(){if(cb)cb();});}

function loadRecsMonth(y,m,cb){
var pre=y+'-'+pad2(m+1)+'-';
recRef.where('date','>=',pre+'01').where('date','<=',pre+pad2(dim(y,m))).get().then(function(s){
dropRecs(function(o){return String(o.date).indexOf(pre)===0;});fillRecs(s);
adjRef.where('month','==',pad2(m+1)).where('year','==',String(y)).get().then(function(as){as.forEach(putAdj);if(cb)cb();}).catch(function(){if(cb)cb();});
}).catch(function(){if(cb)cb();});
}

/* Ek staff-er ek diner record (2 ta equality filter — kono extra index lage na) */
function loadEmpDay(eid,dt,cb){recRef.where('empId','==',eid).where('date','==',dt).get().then(function(s){dropRecs(function(o){return o.empId===eid&&o.date===dt;});fillRecs(s);if(cb)cb();}).catch(function(){if(cb)cb();});}

/* Ek staff-er sob attendance (History + Salary tab-er jonno, dorkar holei load hoy) */
var _empRecsFor=null,_empRecsFailed=false;
function loadEmpRecs(eid,cb){
_empRecsFailed=false;
recRef.where('empId','==',eid).get().then(function(s){dropRecs(function(o){return o.empId===eid;});fillRecs(s);_empRecsFor=eid;if(cb)cb();}).catch(function(){_empRecsFailed=true;if(cb)cb();});
}
function ensureEmpRecs(cb){if(!selE||_empRecsFor===selE.id){if(cb)cb();return;}loadEmpRecs(selE.id,cb);}
function loadEmpAdj(eid,cb){adjRef.where('empId','==',eid).get().then(function(s){s.forEach(putAdj);if(cb)cb();}).catch(function(){if(cb)cb();});}

/* ===================== ATTENDANCE CUTOFF ===================== */
function cutoffHM(){var h=parseInt(S.cutoffHr,10),m=parseInt(S.cutoffMin,10);if(isNaN(h)||h<0||h>23)h=11;if(isNaN(m)||m<0||m>59)m=10;return {h:h,m:m};}
function cutoffStr(){var c=cutoffHM();return pad2(c.h)+':'+pad2(c.m);}
function isPastCutoff(d){d=d||new Date();var c=cutoffHM();return d.getHours()>c.h||(d.getHours()===c.h&&d.getMinutes()>=c.m);}

/* ===================== AUTO ABSENT =====================
   Cutoff time par hole jara attendance deyni (late-allow chhara) tader automatic Absent record toiri hoy.
   Pichhoner AUTO_ABS_DAYS din-er missing din-o (Sunday bad) Absent hoye jay.
   Doc ID fixed (auto_<empId>_<date>) — tai eki din dui device theke chalaleo duplicate hoy na.
   Settings-e 'autoAbsentDone' marker rakhi, jate dine 2 bar-er beshi pura sweep na chole. */
var _sweepBusy=false;
function runAutoAbsent(force,cb){
cb=cb||noop;
if(_sweepBusy||!loaded){cb(null);return;}
_sweepBusy=true;
var now=new Date(),today=fd(now),afterCut=isPastCutoff(now),key=today+'_'+(afterCut?1:0);
function fin(created){_sweepBusy=false;cb(created);}
setRef.get().then(function(sd){
var o0=(sd&&sd.exists)?(sd.data()||{}):{};
var doneKey=o0.autoAbsentDone||'';
if(!force&&(doneKey===key||doneKey===today+'_1')){fin(null);return;}
var dates=[];
for(var i=AUTO_ABS_DAYS;i>=0;i--){var dd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);if(dd.getDay()===0)continue;if(i===0&&!afterCut)continue;dates.push(fd(dd));}
var emps=activeE();
if(!dates.length||!emps.length){setRef.set({autoAbsentDone:key},{merge:true}).catch(noop);fin(null);return;}
var lo=dates[0],hi=dates[dates.length-1];
loadLateAllows(function(){
recRef.where('date','>=',lo).where('date','<=',hi).get().then(function(snap){
dropRecs(function(o){return o.date>=lo&&o.date<=hi;});
var have={};
snap.forEach(function(d){var o=d.data();o._id=d.id;have[o.empId+'_'+o.date]=1;putRec(o);});
var jobs=[],todayLbl='Auto-Absent ('+cutoffStr()+')';
emps.forEach(function(emp){
dates.forEach(function(dt){
if(have[emp.id+'_'+dt])return;
if(emp.joinedOn&&dt<emp.joinedOn)return;
if(dt===today&&LATE[emp.id])return;
jobs.push(writeAutoAbs(emp,dt,dt===today?todayLbl:'Auto-Absent (Not marked)'));
});
});
Promise.all(jobs).then(function(res){
var created={},n=0,fail=0;
res.forEach(function(r){if(r){created[r]=true;n++;}else fail++;});
if(!fail)setRef.set({autoAbsentDone:key},{merge:true}).catch(noop);
fin(n?created:null);
});
}).catch(function(){fin(null);});
});
}).catch(function(){fin(null);});

/* ===================== SALARY ADJUSTMENTS =====================
   adjustments doc: fine, paid, paidDate, paidAmount, coreSalary, corePaid, perfBonus, perfBonusPaid ...
   extras: [{id,title,amount,paid,paidDate,inSalary}]  <- OT / Bonus list (title soho)
     paid     = alada (separately) pay kora hoyeche
     inSalary = "Mark Salary Paid" korar somoy salary-r sathe pay hoyeche
   Purono doc-e 'overtime' number thakle seta "Overtime" title-er ekta item hisebe dhora hoy. */
function newXId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function normExtras(adj){
adj=adj||{};
var out=[];
if(Array.isArray(adj.extras)){
for(var i=0;i<adj.extras.length;i++){var x=adj.extras[i]||{};var amt=parseFloat(x.amount)||0;if(amt<=0)continue;
out.push({id:String(x.id||('x'+i)),title:String(x.title||'').trim()||'OT / Bonus',amount:amt,paid:!!x.paid,paidDate:String(x.paidDate||''),inSalary:!!x.inSalary});}
return out;
}
var ot=parseFloat(adj.overtime)||0;
if(ot>0)out.push({id:'legacy',title:'Overtime',amount:ot,paid:!!adj.otPaid,paidDate:String(adj.otPaidDate||''),inSalary:!!adj.paid&&!adj.otPaid});
return out;
}
/* Ek employee-r ek masher adjustment doc-e patch save (na thakle notun doc, fixed ID) */
function adjWrite(eid,y,m,patch){
var k=eid+'_'+y+'_'+m,ex=ADJ[k];
if(ex&&ex._id){return adjRef.doc(ex._id).update(patch).then(function(){for(var p in patch)ex[p]=patch[p];return ex;});}
var id=eid+'_'+y+'_'+pad2(m+1);
var data={empId:eid,year:String(y),month:pad2(m+1)};
for(var p in patch)data[p]=patch[p];
return adjRef.doc(id).set(data,{merge:true}).then(function(){var cur=ADJ[k]||{};for(var q in data)cur[q]=data[q];cur._id=id;ADJ[k]=cur;return cur;});

/* Load salary history for ALL employees (needed for accurate getSalForMonth in admin salary page) */
var _salHistLoaded=false;
function loadAllSalHist(cb){
if(_salHistLoaded){if(cb)cb();return;}
salHistRef.get().then(function(snap){
snap.forEach(function(d){var o=d.data();o._id=d.id;
if(!SALHIST[o.empId])SALHIST[o.empId]=[];
// Avoid duplicates
var exists=false;for(var x=0;x<SALHIST[o.empId].length;x++)if(SALHIST[o.empId][x]._id===o._id){exists=true;break;}
if(!exists)SALHIST[o.empId].push(o);
});
// Sort each employee's history by createdAt desc
for(var k in SALHIST){SALHIST[k].sort(function(a,b){
var ta=a.createdAt?((typeof a.createdAt.toDate==='function')?a.createdAt.toDate().getTime():((a.createdAt.seconds||0)*1000)):0;
var tb=b.createdAt?((typeof b.createdAt.toDate==='function')?b.createdAt.toDate().getTime():((b.createdAt.seconds||0)*1000)):0;
return tb-ta;
});}
_salHistLoaded=true;
if(cb)cb();
}).catch(function(){if(cb)cb();});
}

/* ===== GET SALARY FOR SPECIFIC MONTH ===== */
function getSalForMonth(e,y,m){
var hist=SALHIST[e.id]||[];
if(hist.length===0)return e.salaryType==='monthly'?e.salary:(e.dailyRate||0);
/* hist is sorted by createdAt DESC (newest first).
   Build a timeline: for each record we know effectiveMonth -> newSalary.
   For the queried (y,m), find the latest increment whose effective month <= queried month.
   If none applies, use the oldSalary of the earliest (oldest) record. */
var queryVal=y*12+m; // numeric month value for comparison
var bestSal=-1, bestVal=-1;
var earliestOld=hist[hist.length-1].oldSalary; // fallback = salary before any increment
for(var i=0;i<hist.length;i++){
var h2=hist[i];
var effParts=(h2.effectiveMonth||'').trim().split(' ');
if(effParts.length<2)continue;
var effMIdx=mn.indexOf(effParts[0]);
var effY=parseInt(effParts[effParts.length-1]);
if(effMIdx<0||isNaN(effY))continue;
var effVal=effY*12+effMIdx;
// This increment applies if queried month >= effective month
if(queryVal>=effVal){
// Pick the one with the latest effective month among those that apply
if(effVal>bestVal){bestVal=effVal;bestSal=h2.newSalary;}
}
}
return bestSal>=0?bestSal:earliestOld;
}

/* ===== CALC SALARY =====
   base      = attendance onujayi salary
   extras    = OT / Bonus list (title soho)
   gross     = base + sob OT/Bonus
   salaryTotal = gross - fine  (ei masher mot salary)
   net       = main salary payment-e ja dite hobe (alada-paid OT/Bonus bade) */
function calcSal(e,y,m){
var totalDays=dim(y,m);
var sun=csun(y,m);
var td=new Date();
var todayMid=new Date(td.getFullYear(),td.getMonth(),td.getDate());
var monthEnd=new Date(y,m,totalDays,23,59,59);
var isPastMonth=monthEnd<todayMid;
var isFutureMonth=new Date(y,m,1)>todayMid;
var monthlySal=e.salaryType==='monthly'?getSalForMonth(e,y,m):0;
var dailyR=e.salaryType==='daily'?getSalForMonth(e,y,m):0;
var perDayRate=e.salaryType==='monthly'?Math.round(monthlySal/30):dailyR;
var adj=ADJ[e.id+'_'+y+'_'+m]||{};
var extras=normExtras(adj),extrasTotal=0,extrasSepPaid=0;
for(var xi=0;xi<extras.length;xi++){extrasTotal+=extras[xi].amount;if(extras[xi].paid)extrasSepPaid+=extras[xi].amount;}
var fine=parseFloat(adj.fine)||0;
var pr2=0,hf2=0,ab2=0,paidSundays=0,presentFullCount=0,base=0;
if(!isFutureMonth){
for(var d=1;d<=totalDays;d++){
var thisDate=new Date(y,m,d);
var isPastDay=thisDate<todayMid;
var isExToday=(thisDate.getTime()===todayMid.getTime());
if(thisDate.getDay()===0){
if(e.salaryType==='monthly'&&(isPastDay||isExToday))paidSundays++;
continue;
}
var dt=y+'-'+pad2(m+1)+'-'+pad2(d);
var rec2=R[e.id+'_'+dt];
if(rec2){
if(rec2.status==='present'){presentFullCount++;
if(rec2.earlyHrs){var worked=8-rec2.earlyHrs;pr2+=Math.max(0,Math.round((worked/8)*100)/100);}
else pr2++;
}else if(rec2.status==='half')hf2++;
else if(rec2.status==='early')hf2++;
else ab2++;
}else if(isPastDay){ab2++;}
}
if(e.salaryType==='monthly'){
var pd=monthlySal/30;
if(isPastMonth){
var earlyMiss=presentFullCount-pr2;
var totalDeductDays=ab2+hf2*0.5+earlyMiss;
base=Math.round(monthlySal-totalDeductDays*pd);
}else{
var paidDays=pr2+hf2*0.5+paidSundays;
base=Math.round(paidDays*pd);
}
if(base>monthlySal)base=monthlySal;
if(base<0)base=0;
}else{
base=Math.round(dailyR*(pr2+hf2*0.5));
}
}
var eff=pr2+hf2*0.5;
var gross=base+extrasTotal;
return {present:pr2,half:hf2,absent:ab2,effective:eff,effWithSun:eff+paidSundays,paidSundays:paidSundays,base:base,
extras:extras,extrasTotal:extrasTotal,extrasSepPaid:extrasSepPaid,fine:fine,gross:gross,
salaryTotal:Math.max(0,gross-fine),net:Math.max(0,gross-extrasSepPaid-fine),
sundays:sun,totalDays:totalDays,perDay:perDayRate,monthlySal:monthlySal};
}

function salMoney(e,sc,adj){

var inSal=0,pending=0;
for(var i=0;i<sc.extras.length;i++){var x=sc.extras[i];if(x.paid)continue;if(isPaid&&x.inSalary)inSal+=x.amount;else pending+=x.amount;}
var grand=sc.salaryTotal+core+perf;
var paid=(isPaid?Math.max(0,sc.base+inSal-sc.fine):0)+sc.extrasSepPaid+(corePaid?core:0)+(perfPaid?perf:0);
var allPaid=isPaid&&pending===0&&(!core||corePaid)&&(!perf||perfPaid);
if(allPaid)paid=grand;
return {isPaid:isPaid,core:core,corePaid:corePaid,perf:perf,perfPaid:perfPaid,pendingExtras:pending,grand:grand,paid:paid,remaining:allPaid?0:Math.max(0,grand-paid),allPaid:allPaid};
}

function numToWords(n){
n=Math.round(n);if(n===0)return 'Zero';
var ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
var tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function two(x){return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');}
function three(x){return x>99?ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);}
var out='';
if(n>=10000000){out+=three(Math.floor(n/10000000))+' Crore ';n%=10000000;}
if(n>=100000){out+=three(Math.floor(n/100000))+' Lakh ';n%=100000;}
if(n>=1000){out+=three(Math.floor(n/1000))+' Thousand ';n%=1000;}
if(n>0)out+=three(n);
return out.trim();
}

function compressImg(file,cb){
try{var reader=new FileReader();
reader.onload=function(ev){var img=new Image();
img.onload=function(){var max=1280,w=img.width,hh=img.height;
if(w>max||hh>max){if(w>hh){hh=Math.round(hh*max/w);w=max;}else{w=Math.round(w*max/hh);hh=max;}}
try{var c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(img,0,0,w,hh);cb(c.toDataURL('image/jpeg',0.72));}catch(e2){cb(null);}};
img.onerror=function(){cb(null);};img.src=ev.target.result;};
reader.onerror=function(){cb(null);};reader.readAsDataURL(file);}catch(e){cb(null);}
}

/* ===== LAZY PDF LIBS ===== */
var _libP=null;
function ensureAuthP(){return new Promise(function(res){ensureAuth(res);});}
function loadScript(src){return new Promise(function(res,rej){var sc=document.createElement('script');sc.src=src;sc.onload=function(){res();};sc.onerror=function(){rej(new Error('load fail'));};document.head.appendChild(sc);});}
function ensureBnFont(){
if(!document.getElementById('bnFontLink')){var l=document.createElement('link');l.id='bnFontLink';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap';document.head.appendChild(l);}
try{return (document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();}catch(e){return Promise.resolve();}
}
function ensurePdfLibs(){
if(_libP)return _libP;
_libP=Promise.resolve()
.then(function(){return window.html2canvas?null:loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');})
.then(function(){return (window.jspdf&&window.jspdf.jsPDF)?null:loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');})
.then(function(){return window.PDFLib?null:loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js').catch(function(){});});
return _libP;
}
function makePrintNode(innerHtml){
var n=document.createElement('div');
n.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#ffffff;color:#111;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;padding:48px 56px;box-sizing:border-box;line-height:1.7';
n.innerHTML=innerHtml;document.body.appendChild(n);return n;
}
function nodeToPdf(node){
return ensurePdfLibs().then(function(){return ensureBnFont();}).then(function(){
return window.html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true});
}).then(function(canvas){
var jsPDF=window.jspdf.jsPDF;var pdf=new jsPDF('p','mm','a4');
var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
var imgW=pw,imgH=canvas.height*imgW/canvas.width;
if(imgH<=ph){pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,imgW,imgH);}
else{var pagePx=Math.floor(canvas.width*ph/pw),pos=0,page=0;
while(pos<canvas.height){var sliceH=Math.min(pagePx,canvas.height-pos);
var c2=document.createElement('canvas');c2.width=canvas.width;c2.height=sliceH;
c2.getContext('2d').drawImage(canvas,0,pos,canvas.width,sliceH,0,0,canvas.width,sliceH);
if(page>0)pdf.addPage();
pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',0,0,imgW,sliceH*imgW/canvas.width);
pos+=sliceH;page++;}}
return pdf;
});
}

function mergeCocWithCert(cocUrl,certBytes){
if(!window.PDFLib)return Promise.resolve(certBytes);
return fetch(cocUrl).then(function(r){if(!r.ok)throw new Error('fetch');return r.arrayBuffer();}).then(function(cocBuf){
var PD=window.PDFLib.PDFDocument;
return PD.create().then(function(out){
return PD.load(cocBuf).then(function(src){
return out.copyPages(src,src.getPageIndices()).then(function(pgs){pgs.forEach(function(p){out.addPage(p);});
return PD.load(certBytes).then(function(cert){return out.copyPages(cert,cert.getPageIndices()).then(function(cp){cp.forEach(function(p){out.addPage(p);});return out.save();});});});
});});
}).catch(function(){return certBytes;});
}
function uploadSignedCoc(bytes,nameVal,signedAt){
return ensureAuthP().then(function(){
var path='coc_signed/'+selE.id+'_'+signedAt+'.pdf';var ref=storage.ref(path);
var blob=new Blob([bytes],{type:'application/pdf'});
return ref.put(blob).then(function(){return ref.getDownloadURL();}).then(function(url){
var rec={empId:selE.id,empName:selE.name,signedName:nameVal,signedAt:signedAt,url:url,path:path,name:'CodeOfConduct_signed_'+String(nameVal).replace(/\s+/g,'_')+'.pdf',cocName:(S.coc&&S.coc.name)||'code_of_conduct.pdf'};
return cocSignRef.doc(selE.id).set(rec).then(function(){COCSIGN[selE.id]=rec;showToast('✅ Code of Conduct signed!');closeOverlay();render();});
});
});
}
function signCoc(){
if(!selE)return;
if(!(S.coc&&S.coc.url))return showToast('❌ Admin akhono COC upload koreni');
var nameEl=document.getElementById('cocName'),consEl=document.getElementById('cocConsent');
var nameVal=nameEl?nameEl.value.trim():'';var consent=consEl?consEl.checked:false;
if(!consent)return showToast('❌ "I agree" box e tick din');
if(!nameVal)return showToast('❌ Apnar pura naam likhun');
if(!storage)return showToast('⚠️ Storage setup baki');
showToast('⏳ Sign hochhe... kichu second wait korun');
var signedAt=Date.now();
var node=makePrintNode(cocCertHTML(selE,nameVal,signedAt));
nodeToPdf(node).then(function(pdf){
if(node.parentNode)node.parentNode.removeChild(node);
var certBytes=pdf.output('arraybuffer');
return mergeCocWithCert(S.coc.url,certBytes).then(function(finalBytes){return uploadSignedCoc(finalBytes,nameVal,signedAt);});
}).catch(function(e){
if(node&&node.parentNode)node.parentNode.removeChild(node);
showToast('❌ Sign error — internet check kore abar try korun');
});
}
