function fd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function csun(y,m){var c=0;for(var d=1;d<=dim(y,m);d++)if(new Date(y,m,d).getDay()===0)c++;return c;}
function geoD(a,b){var R2=6371e3,toR=function(x){return x*Math.PI/180;};var dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return R2*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},3000);}

function loadAll(cb){

recRef.where('date','==',fd()).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});chk();}).catch(function(){chk();});
loadLateAllows(chk);
}

function loadLateAllows(cb){
db.collection('lateAllow').where('date','==',fd()).get().then(function(s){LATE={};s.forEach(function(d){var o=d.data();LATE[o.empId]=o.allowed;});if(cb)cb();}).catch(function(){if(cb)cb();});
}

function loadRecsDate(dt,cb){recRef.where('date','==',dt).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});if(cb)cb();}).catch(function(){if(cb)cb();});}

function loadRecsMonth(y,m,cb){
var s2=y+'-'+String(m+1).padStart(2,'0')+'-01',e2=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dim(y,m)).padStart(2,'0');
recRef.where('date','>=',s2).where('date','<=',e2).get().then(function(s){s.forEach(function(d){var o=d.data();o._id=d.id;R[o.empId+'_'+o.date]=o;});
adjRef.where('month','==',String(m+1).padStart(2,'0')).where('year','==',String(y)).get().then(function(as){as.forEach(function(ad){var ao=ad.data();ao._id=ad.id;ADJ[ao.empId+'_'+y+'_'+m]=ao;});if(cb)cb();}).catch(function(){if(cb)cb();});
}).catch(function(){if(cb)cb();});
}

/* Load salary history for ALL employees (needed for accurate getSalForMonth in admin salary page) */
var _salHistLoaded=false;
function loadAllSalHist(cb){
if(_salHistLoaded){if(cb)cb();return;}
salHistRef.get().then(function(snap){
snap.forEach(function(d){var o=d.data();o._id=d.id;
if(!SALHIST[o.empId])SALHIST[o.empId]=[];
// Avoid duplicates
var exists=false;for(var x=0;x<SALHIST[o.empId].length;x++)if(SALHIST[o.empId][x]._id===o._id){exists=true;break;}
if(!exists)SALHIST[o.empId].push(o);
});
// Sort each employee's history by createdAt desc
for(var k in SALHIST){SALHIST[k].sort(function(a,b){
var ta=a.createdAt?((typeof a.createdAt.toDate==='function')?a.createdAt.toDate().getTime():((a.createdAt.seconds||0)*1000)):0;
var tb=b.createdAt?((typeof b.createdAt.toDate==='function')?b.createdAt.toDate().getTime():((b.createdAt.seconds||0)*1000)):0;
return tb-ta;
});}
_salHistLoaded=true;
if(cb)cb();
}).catch(function(){if(cb)cb();});
}

var salaryPwdSet=false,salaryPwdInput='';

document.getElementById('adminNav').style.display='none';
var today=fd();
var h='<div style="padding:16px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px"><button id="sBack" style="background:none;border:none;color:#7d8590;font-size:22px;cursor:pointer">←</button><div><div style="font-size:17px;font-weight:600;color:#e6edf3">👤 '+(selE?selE.name:'Staff')+'</div></div></div>';

h+='<div style="padding:24px 20px"><h2 class="df" style="font-size:20px;margin-bottom:4px;color:#e6edf3">Apnar Naam Select Korun</h2><p style="color:#7d8590;font-size:13px;margin-bottom:20px">'+bn()+'</p>';

else{var sE=sortedE(),lastType='';

for(var d=0;d<4;d++)h+='<div style="width:48px;height:56px;border-radius:12px;border:2px solid '+(pin.length>d?'#00d4aa':'#30363d')+';background:'+(pin.length>d?'#00d4aa22':'#161b22')+';display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#00d4aa">'+(pin[d]?'●':'')+'</div>';

}else if(sStep==='mark'||sStep==='salary'){

var nowD=new Date();

/* ===== GET SALARY FOR SPECIFIC MONTH ===== */
function getSalForMonth(e,y,m){
var hist=SALHIST[e.id]||[];
if(hist.length===0)return e.salaryType==='monthly'?e.salary:(e.dailyRate||0);
/* hist is sorted by createdAt DESC (newest first).
   Build a timeline: for each record we know effectiveMonth -> newSalary.
   For the queried (y,m), find the latest increment whose effective month <= queried month.
   If none applies, use the oldSalary of the earliest (oldest) record. */
var queryVal=y*12+m; // numeric month value for comparison
var bestSal=-1, bestVal=-1;
var earliestOld=hist[hist.length-1].oldSalary; // fallback = salary before any increment
for(var i=0;i<hist.length;i++){
var h2=hist[i];
var effParts=(h2.effectiveMonth||'').trim().split(' ');
if(effParts.length<2)continue;
var effMIdx=mn.indexOf(effParts[0]);
var effY=parseInt(effParts[effParts.length-1]);
if(effMIdx<0||isNaN(effY))continue;
var effVal=effY*12+effMIdx;
// This increment applies if queried month >= effective month
if(queryVal>=effVal){
// Pick the one with the latest effective month among those that apply
if(effVal>bestVal){bestVal=effVal;bestSal=h2.newSalary;}
}
}
return bestSal>=0?bestSal:earliestOld;
}

/* ===== CALC SALARY ===== */
function calcSal(e,y,m){
var totalDays=dim(y,m);
var sun=csun(y,m);
var td=new Date();
var todayMid=new Date(td.getFullYear(),td.getMonth(),td.getDate());
var monthEnd=new Date(y,m,totalDays,23,59,59);
var isPastMonth=monthEnd<todayMid;
var isFutureMonth=new Date(y,m,1)>todayMid;
var monthlySal=e.salaryType==='monthly'?getSalForMonth(e,y,m):0;
var dailyR=e.salaryType==='daily'?getSalForMonth(e,y,m):0;
var perDayRate=e.salaryType==='monthly'?Math.round(monthlySal/30):dailyR;
if(isFutureMonth){
return {present:0,half:0,absent:0,effective:0,effWithSun:0,paidSundays:0,base:0,overtime:0,otPaid:false,fine:0,net:0,sundays:sun,totalDays:totalDays,perDay:perDayRate,monthlySal:monthlySal};
}
var pr2=0,hf2=0,ab2=0,paidSundays=0,presentFullCount=0;
for(var d=1;d<=totalDays;d++){
var thisDate=new Date(y,m,d);
var isPastDay=thisDate<todayMid;
var isExToday=(thisDate.getTime()===todayMid.getTime());
if(thisDate.getDay()===0){
if(e.salaryType==='monthly'&&(isPastDay||isExToday))paidSundays++;
continue;
}
var dt=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
var rec2=R[e.id+'_'+dt];
if(rec2){
if(rec2.status==='present'){presentFullCount++;
if(rec2.earlyHrs){var worked=8-rec2.earlyHrs;pr2+=Math.max(0,Math.round((worked/8)*100)/100);}
else pr2++;
}else if(rec2.status==='half')hf2++;
else if(rec2.status==='early')hf2++;
else ab2++;
}else if(isPastDay){ab2++;}
}
var adjKey=e.id+'_'+y+'_'+m;
var adj=ADJ[adjKey]||{overtime:0,fine:0};
var ot=parseFloat(adj.overtime)||0;
var fine=parseFloat(adj.fine)||0;
var otPaid=adj.otPaid||false;
var eff=pr2+hf2*0.5;
var effWithSun=eff+paidSundays;
var base;
if(e.salaryType==='monthly'){
var pd=monthlySal/30;
if(isPastMonth){
var earlyMiss=presentFullCount-pr2;
var totalDeductDays=ab2+hf2*0.5+earlyMiss;
base=Math.round(monthlySal-totalDeductDays*pd);
}else{
var paidDays=pr2+hf2*0.5+paidSundays;
base=Math.round(paidDays*pd);
}
if(base>monthlySal)base=monthlySal;
if(base<0)base=0;
}else{
base=Math.round(dailyR*eff);
}
var netOt=otPaid?0:ot;
var net=base+netOt-fine;
return {present:pr2,half:hf2,absent:ab2,effective:eff,effWithSun:effWithSun,paidSundays:paidSundays,base:base,overtime:ot,otPaid:otPaid,fine:fine,net:Math.max(0,net),sundays:sun,totalDays:totalDays,perDay:perDayRate,monthlySal:monthlySal};
}

// Render form IMMEDIATELY (no waiting for Firestore)
var h='<div style="border-radius:16px;border:2px solid #00d4aa44;background:#161b22;overflow:hidden;margin-bottom:16px">';
h+='<div style="padding:16px 18px;background:linear-gradient(135deg,#00d4aa15,#00d4aa08);border-bottom:1px solid #00d4aa33">';
h+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">📈</span><div><div style="color:#00d4aa;font-size:16px;font-weight:700">Salary Increment</div><div style="color:#e6edf3;font-size:14px;font-weight:600;margin-top:2px">'+emp.name+'</div></div></div>';
h+='</div>';
h+='<div style="padding:18px">';
// Current salary
h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:#0c1117;border:1px solid #30363d;margin-bottom:16px">';
h+='<div><div style="color:#7d8590;font-size:11px;text-transform:uppercase;letter-spacing:0.5px">Current Salary</div><div style="color:#e6edf3;font-size:22px;font-weight:700;font-family:Playfair Display,serif;margin-top:2px">₹'+curSal.toLocaleString('en-IN')+'</div></div>';
h+='<div style="color:#7d8590;font-size:12px;text-align:right">'+(emp.salaryType==='monthly'?'per month':'per day')+'</div>';
h+='</div>';
// New salary
h+='<label style="color:#7d8590;font-size:12px;font-weight:600;display:block;margin-bottom:6px">New Salary (₹)</label>';
h+='<input id="incNewSal" type="number" placeholder="e.g. '+(curSal+Math.round(curSal*0.1))+'" style="font-size:18px;font-weight:600;padding:14px 16px;margin-bottom:14px">';
// Effective from
h+='<label style="color:#7d8590;font-size:12px;font-weight:600;display:block;margin-bottom:6px">Effective From</label>';
h+='<select id="incEffMonth" style="font-size:15px;padding:14px 16px;margin-bottom:8px">'+effOpts+'</select>';
// Info
h+='<div style="padding:10px 14px;border-radius:10px;background:#fbbf2410;border:1px solid #fbbf2422;margin-bottom:16px">';
h+='<div style="color:#fbbf24;font-size:11px;line-height:1.6">💡 <strong>Note:</strong> New salary only applies from the selected month onwards. Previous months will keep their original salary — no effect on past calculations.</div>';
h+='</div>';
// Preview
h+='<div id="incPreview" style="margin-bottom:16px"></div>';
// Buttons
h+='<div style="display:flex;gap:10px"><button id="incSave" class="btn bp" style="font-size:15px;padding:16px">Save Increment 📈</button><button id="incCancel" class="btn bs" style="width:auto;padding:16px 24px;font-size:14px">Cancel</button></div>';
h+='</div>';
// History placeholder (loaded async)
h+='<div id="incHistArea" style="padding:0 18px 18px"><div style="text-align:center;color:#7d8590;font-size:12px;padding:8px">Loading history...</div></div>';
h+='</div>';
area.innerHTML=h;

// Bind preview
function updatePreview(){
var newSal=parseFloat(document.getElementById('incNewSal').value)||0;
var prevEl=document.getElementById('incPreview');
if(!prevEl)return;
if(newSal<=0||newSal<=curSal){prevEl.innerHTML='';return;}
var diff=newSal-curSal;var pct=Math.round((diff/curSal)*100);
var effLabel=document.getElementById('incEffMonth').value;
prevEl.innerHTML='<div style="padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#10b98112,#10b98106);border:1px solid #10b98133">'+
'<div style="display:flex;justify-content:space-between;align-items:center">'+
'<div><div style="color:#10b981;font-size:13px;font-weight:700">Increment Preview</div>'+
'<div style="color:#e6edf3;font-size:15px;font-weight:600;margin-top:4px">₹'+curSal.toLocaleString('en-IN')+' → ₹'+newSal.toLocaleString('en-IN')+'</div>'+
'<div style="color:#7d8590;font-size:11px;margin-top:2px">From: '+effLabel+'</div></div>'+
'<div style="text-align:right"><div style="padding:6px 12px;border-radius:20px;background:#10b98122;color:#10b981;font-size:14px;font-weight:700">+₹'+diff.toLocaleString('en-IN')+'</div>'+
'<div style="color:#fbbf24;font-size:11px;margin-top:4px">+'+pct+'% increase</div></div></div></div>';
}
var incNewEl=document.getElementById('incNewSal');if(incNewEl)incNewEl.addEventListener('input',updatePreview);
var incEffEl=document.getElementById('incEffMonth');if(incEffEl)incEffEl.addEventListener('change',updatePreview);

// Bind save
document.getElementById('incSave').onclick=function(){
var newSal=parseFloat(document.getElementById('incNewSal').value)||0;
var effMonth=document.getElementById('incEffMonth').value;
if(newSal<=0)return showToast('❌ New salary likhun!');
if(newSal<=curSal)return showToast('❌ New salary must be higher than current ₹'+curSal.toLocaleString('en-IN')+'!');
var effParts=effMonth.trim().split(' ');
var effMIdx2=mn.indexOf(effParts[0]);
var effYVal2=parseInt(effParts[effParts.length-1]);
var histData={empId:eid,empName:emp.name,oldSalary:curSal,newSalary:newSal,effectiveMonth:effMonth,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
showToast('💾 Saving...');
salHistRef.add(histData).then(function(doc){
histData._id=doc.id;
_salHistLoaded=false;
if(!SALHIST[eid])SALHIST[eid]=[];
SALHIST[eid].unshift(histData);
var nowMonth=nowD.getMonth();var nowYear=nowD.getFullYear();
var effAppliesNow=(effYVal2<nowYear)||(effYVal2===nowYear&&effMIdx2<=nowMonth);
if(effAppliesNow){
var upd=emp.salaryType==='monthly'?{salary:newSal}:{dailyRate:newSal};
empRef.doc(eid).update(upd).then(function(){
if(emp.salaryType==='monthly')emp.salary=newSal;else emp.dailyRate=newSal;
showToast('📈 Salary updated: ₹'+newSal.toLocaleString('en-IN')+' (effective '+effMonth+')');
area.innerHTML='';render();
});
}else{
showToast('📈 Increment saved! Will apply from '+effMonth);
area.innerHTML='';render();
}
}).catch(function(err){showToast('❌ Save error: '+(err.message||'Try again'));});
};
// Bind cancel
document.getElementById('incCancel').onclick=function(){area.innerHTML='';};

// Load history in background (non-blocking)
try{
salHistRef.where('empId','==',eid).get().then(function(snap){
var histArr=[];snap.forEach(function(d){histArr.push(Object.assign({_id:d.id},d.data()));});
histArr.sort(function(a,b){
var ta=a.createdAt?((typeof a.createdAt.toDate==='function')?a.createdAt.toDate().getTime():((a.createdAt.seconds||0)*1000)):0;
var tb=b.createdAt?((typeof b.createdAt.toDate==='function')?b.createdAt.toDate().getTime():((b.createdAt.seconds||0)*1000)):0;
return tb-ta;});
SALHIST[eid]=histArr;
// Render history into placeholder
var hArea=document.getElementById('incHistArea');
if(!hArea)return;
if(histArr.length===0){hArea.innerHTML='<div style="text-align:center;color:#7d8590;font-size:12px;padding:8px">No previous increments</div>';return;}
var hh='<div style="color:#7d8590;font-size:12px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Increment History</div>';
for(var si=0;si<histArr.length;si++){var hi=histArr[si];
var incAmt=hi.newSalary-hi.oldSalary;var incPct=hi.oldSalary>0?Math.round((incAmt/hi.oldSalary)*100):0;
hh+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:#0c1117;margin-bottom:6px;border:1px solid #30363d">';
hh+='<div><div style="color:#e6edf3;font-size:13px;font-weight:600">₹'+hi.oldSalary.toLocaleString('en-IN')+' → ₹'+hi.newSalary.toLocaleString('en-IN')+'</div>';
hh+='<div style="color:#7d8590;font-size:11px;margin-top:2px">Effective: '+hi.effectiveMonth+'</div></div>';
hh+='<div style="text-align:right"><div style="color:#10b981;font-size:13px;font-weight:700">+₹'+incAmt.toLocaleString('en-IN')+'</div>';
hh+='<div style="color:#fbbf24;font-size:10px">+'+incPct+'%</div></div>';
hh+='<button data-hid="'+hi._id+'" data-eid="'+eid+'" data-old="'+hi.oldSalary+'" class="delHist" style="background:none;border:none;font-size:14px;cursor:pointer;margin-left:6px" title="Delete">🗑️</button>';
hh+='</div>';}
hArea.innerHTML=hh;
// Bind delete buttons
var delBtns=hArea.querySelectorAll('.delHist');
for(var dh=0;dh<delBtns.length;dh++)delBtns[dh].onclick=function(){
var hid=this.getAttribute('data-hid');
var dEid=this.getAttribute('data-eid');
var oldSalVal=parseFloat(this.getAttribute('data-old'));
if(!confirm('Ei increment record delete korben?'))return;
salHistRef.doc(hid).delete().then(function(){
_salHistLoaded=false;
var hArr2=SALHIST[dEid]||[];
SALHIST[dEid]=hArr2.filter(function(x){return x._id!==hid;});
var remaining=SALHIST[dEid];
if(remaining.length===0){
var revertUpd=emp.salaryType==='monthly'?{salary:oldSalVal}:{dailyRate:oldSalVal};
empRef.doc(dEid).update(revertUpd).then(function(){
if(emp.salaryType==='monthly')emp.salary=oldSalVal;else emp.dailyRate=oldSalVal;
showToast('🗑️ Deleted & reverted to ₹'+oldSalVal.toLocaleString('en-IN'));
showIncForm(dEid);});
}else{
var nowM2=new Date().getMonth(),nowY2=new Date().getFullYear();
var correctSal=getSalForMonth(emp,nowY2,nowM2);
var revertUpd2=emp.salaryType==='monthly'?{salary:correctSal}:{dailyRate:correctSal};
empRef.doc(dEid).update(revertUpd2).then(function(){
if(emp.salaryType==='monthly')emp.salary=correctSal;else emp.dailyRate=correctSal;
showToast('🗑️ Deleted! Salary: ₹'+correctSal.toLocaleString('en-IN'));
showIncForm(dEid);});
}
}).catch(function(){showToast('❌ Delete failed!');});
};
}).catch(function(err){
var hArea=document.getElementById('incHistArea');
if(hArea)hArea.innerHTML='<div style="text-align:center;color:#7d8590;font-size:11px;padding:8px">History not available</div>';
});
}catch(e){
var hArea=document.getElementById('incHistArea');
if(hArea)hArea.innerHTML='';
}
}

/* ===== EMPLOYEE FORM ===== */
function showEF(){
var e=eId?null:{name:'',phone:'',salaryType:'monthly',salary:'',dailyRate:'',pin:''};
if(eId){for(var i=0;i<E.length;i++)if(E[i].id===eId){e=E[i];break;}}if(!e)return;
var area=document.getElementById('eFA');if(!area)return;
var ftype=e.salaryType||'monthly';
area.innerHTML='<div class="card" style="border-color:#00d4aa44"><input id="fn" placeholder="Naam" value="'+e.name+'"><input id="fp" placeholder="Phone" value="'+(e.phone||'')+'"><input id="fpi" placeholder="4-digit PIN" maxlength="4" value="'+(e.pin||'')+'"><div style="display:flex;gap:8px;margin-bottom:12px"><button id="tM" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='monthly'?'#00d4aa':'#30363d')+';background:'+(ftype==='monthly'?'#00d4aa22':'transparent')+';color:'+(ftype==='monthly'?'#00d4aa':'#7d8590')+'">📅 Monthly</button><button id="tD" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='daily'?'#00d4aa':'#30363d')+';background:'+(ftype==='daily'?'#00d4aa22':'transparent')+';color:'+(ftype==='daily'?'#00d4aa':'#7d8590')+'">📆 Daily</button></div><input id="fsa" type="number" placeholder="Monthly Salary (₹)" value="'+(e.salary||'')+'" style="display:'+(ftype==='daily'?'none':'block')+'"><input id="fda" type="number" placeholder="Daily Rate (₹)" value="'+(e.dailyRate||'')+'" style="display:'+(ftype==='daily'?'block':'none')+'"><div style="display:flex;gap:8px"><button id="svE" class="btn bp">'+(eId?'Update':'Save')+' ✅</button><button id="cnE" class="btn bs" style="width:auto;padding:14px 20px">Cancel</button></div></div>';

document.getElementById('tM').onclick=function(){ftype='monthly';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tD').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fsa').style.display='block';document.getElementById('fda').style.display='none';};
document.getElementById('tD').onclick=function(){ftype='daily';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tM').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fda').style.display='block';document.getElementById('fsa').style.display='none';};

document.getElementById('svE').onclick=function(){
var name=document.getElementById('fn').value.trim(),phone=document.getElementById('fp').value.trim(),pinV=document.getElementById('fpi').value;
var sal=parseFloat(document.getElementById('fsa').value)||0,daily=parseFloat(document.getElementById('fda').value)||0;
if(!name)return showToast('Naam likhun!');if(!pinV||pinV.length!==4)return showToast('4 digit PIN deen!');
var data={name:name,phone:phone,salaryType:ftype,salary:sal,dailyRate:daily,pin:pinV};
showToast('💾 Saving...');
if(eId){empRef.doc(eId).update(data).then(function(){for(var i=0;i<E.length;i++)if(E[i].id===eId){data.id=eId;E[i]=data;break;}showToast('✅ Updated!');eId=null;render();}).catch(function(){showToast('Error!');});}
else{empRef.add(data).then(function(doc){data.id=doc.id;E.push(data);showToast('✅ Added!');eId=null;render();}).catch(function(){showToast('Error!');});}};
document.getElementById('cnE').onclick=function(){eId=null;render();};
}

loadAll(function(){render();});
})();
</script>
