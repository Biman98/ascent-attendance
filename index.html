<!DOCTYPE html>
<html lang="bn" style="background:#0c1117!important">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ascent Digital Creation</title>
<meta name="theme-color" content="#0c1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{background:#0c1117!important;margin:0;padding:0}
*{margin:0;padding:0;box-sizing:border-box}
body{color:#e6edf3;font-family:'Nunito Sans',system-ui,sans-serif;max-width:480px;margin:0 auto!important;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.df{font-family:'Playfair Display',Georgia,serif}
input,select{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #30363d;background:#0c1117;color:#e6edf3;font-size:15px;margin-bottom:11px;outline:none;font-family:inherit;-webkit-appearance:none}
input::placeholder{color:#7d8590}
select{-webkit-appearance:auto;appearance:auto}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:none;text-align:center;-webkit-tap-highlight-color:transparent}
.bp{background:#00d4aa;color:#0c1117}
.bs{background:transparent;color:#7d8590;border:1px solid #30363d}
.card{background:#161b22;border-radius:14px;padding:16px;border:1px solid #30363d;margin-bottom:12px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#161b22;color:#e6edf3;padding:12px 24px;border-radius:12px;border:1px solid #00d4aa;z-index:999;font-size:14px;opacity:0;transition:all .3s;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#161b22;border-top:1px solid #30363d;display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,12px);z-index:100}
.nav button{background:none;border:none;color:#7d8590;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;-webkit-tap-highlight-color:transparent}
.nav button.on{color:#00d4aa}
.nav button i{font-size:20px;font-style:normal}
.att-btn{padding:20px;border-radius:16px;cursor:pointer;text-align:center;border:none;width:100%;margin-bottom:12px;-webkit-tap-highlight-color:transparent}
@media(prefers-color-scheme:light){html,body{background:#0c1117!important;color:#e6edf3!important}}
</style>
</head>
<body style="background:#0c1117!important">
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
"use strict";
document.documentElement.style.background="#0c1117";
document.body.style.background="#0c1117";

var canLS=false;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t');canLS=true;}catch(e){canLS=false;}
function lsG(k,d){if(!canLS)return d;try{var v=localStorage.getItem('adc_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsS(k,v){if(!canLS)return;try{localStorage.setItem('adc_'+k,JSON.stringify(v));}catch(e){}}

var E=lsG('emps',[]),R=lsG('recs',{}),S=lsG('set',{lat:22.5726,lng:88.3639,radius:200});
function sv(){lsS('emps',E);lsS('recs',R);lsS('set',S);}

function fd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function csun(y,m){var c=0;for(var d=1;d<=dim(y,m);d++)if(new Date(y,m,d).getDay()===0)c++;return c;}
function geoD(a,b){var R2=6371e3,toR=function(x){return x*Math.PI/180;};var dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);return R2*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},3000);}
function bn(){try{return new Date().toLocaleDateString('bn-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return fd();}}
function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

var mode=null,pg='dash',sStep='sel',selE=null,pin='',eId=null,attD=fd(),salM=new Date().getMonth(),salY=new Date().getFullYear();
var app=document.getElementById('app');

function render(){
try{
if(!mode)rMode();
else if(mode==='staff')rStaff();
else rAdmin();
}catch(e){
app.innerHTML='<div style="padding:40px;text-align:center"><p style="color:#ff6b6b;font-size:16px">Error: '+e.message+'</p><button class="btn bp" style="margin-top:20px;max-width:200px;margin-left:auto;margin-right:auto" onclick="location.reload()">Reload</button></div>';
}}

/* ===== HOME ===== */
function rMode(){
app.innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:#0c1117">'+
'<div style="font-size:56px;margin-bottom:16px">🏢</div>'+
'<h1 class="df" style="font-size:26px;margin-bottom:6px;color:#e6edf3">Ascent Digital Creation</h1>'+
'<p style="color:#7d8590;font-size:13px;margin-bottom:44px">Attendance & Salary System</p>'+
'<div style="width:100%;max-width:320px">'+
'<button class="btn bp" id="bA" style="margin-bottom:14px;padding:18px;font-size:16px">🔐 Admin Panel</button>'+
'<button class="btn bs" id="bS" style="padding:18px;font-size:16px;border-color:#00d4aa55;color:#00d4aa">👤 Staff Attendance</button></div>'+
'<p style="color:#7d8590;font-size:11px;margin-top:44px;text-align:center;line-height:1.8">Admin → Staff manage, attendance, salary<br>Staff → Geo-fenced attendance</p>'+
(!canLS?'<p style="color:#fbbf24;font-size:11px;margin-top:16px;text-align:center;background:#fbbf2415;padding:8px 16px;border-radius:8px">⚠️ Preview mode — real site e data save hobe</p>':'')+
'</div>';
document.getElementById('bA').onclick=function(){mode='admin';pg='dash';render();};
document.getElementById('bS').onclick=function(){mode='staff';sStep='sel';selE=null;pin='';render();};
}

/* ===== STAFF ===== */
function rStaff(){
var today=fd();
var h='<div style="padding:16px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;background:#0c1117">'+
'<button id="sBack" style="background:none;border:none;color:#7d8590;font-size:22px;cursor:pointer">\u2190</button>'+
'<div><div style="font-size:17px;font-weight:600;color:#e6edf3">👤 Staff Attendance</div>'+
(selE?'<div style="color:#00d4aa;font-size:12px">'+selE.name+'</div>':'')+
'</div></div>';

if(sStep==='sel'){
h+='<div style="padding:24px 20px"><h2 class="df" style="font-size:20px;margin-bottom:4px;color:#e6edf3">Apnar Naam Select Korun</h2>'+
'<p style="color:#7d8590;font-size:13px;margin-bottom:20px">'+bn()+'</p>';
if(E.length===0)h+='<p style="color:#7d8590;text-align:center;margin-top:40px">Admin ke bolun employee add korte</p>';
else for(var i=0;i<E.length;i++){var e=E[i];var rec=R[e.id+'_'+today];
var st=rec?(rec.status==='present'?'✅':rec.status==='half'?'🕐':'❌'):'';
h+='<button data-i="'+e.id+'" class="eS" style="width:100%;padding:16px;margin-bottom:10px;border-radius:14px;border:1px solid #30363d;background:#161b22;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left">'+
'<div style="width:44px;height:44px;border-radius:12px;background:#00d4aa22;display:flex;align-items:center;justify-content:center;color:#00d4aa;font-weight:700;font-size:18px">'+e.name[0].toUpperCase()+'</div>'+
'<div style="flex:1"><div style="color:#e6edf3;font-size:15px;font-weight:600">'+e.name+'</div>'+
'<div style="color:#7d8590;font-size:12px">'+(e.salaryType==='monthly'?'₹'+e.salary+'/mo':'₹'+e.dailyRate+'/day')+'</div></div>'+
'<span style="font-size:18px">'+st+'</span></button>';}
h+='</div>';
}
else if(sStep==='pin'){
h+='<div style="padding:24px 20px;text-align:center">'+
'<div style="width:72px;height:72px;border-radius:20px;background:#00d4aa22;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#00d4aa">'+selE.name[0].toUpperCase()+'</div>'+
'<h2 class="df" style="font-size:20px;margin-bottom:4px;color:#e6edf3">'+selE.name+'</h2>'+
'<p style="color:#7d8590;font-size:13px;margin-bottom:28px">4-digit PIN deen</p><div style="display:flex;justify-content:center;gap:12px;margin-bottom:24px">';
for(var d=0;d<4;d++)h+='<div style="width:48px;height:56px;border-radius:12px;border:2px solid '+(pin.length>d?'#00d4aa':'#30363d')+';background:'+(pin.length>d?'#00d4aa22':'#161b22')+';display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#00d4aa">'+(pin[d]?'●':'')+'</div>';
h+='</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:280px;margin:0 auto">';
var nums=[1,2,3,4,5,6,7,8,9,'',0,'del'];
for(var n=0;n<nums.length;n++){if(nums[n]==='')h+='<div></div>';
else h+='<button class="nB" data-v="'+nums[n]+'" style="padding:16px;font-size:22px;font-weight:600;border-radius:14px;border:1px solid #30363d;background:#161b22;color:#e6edf3;cursor:pointer">'+(nums[n]==='del'?'⌫':nums[n])+'</button>';}
h+='</div><button id="vBtn" class="btn bp" style="margin-top:20px;opacity:'+(pin.length===4?1:0.5)+'">Verify →</button></div>';
}
else if(sStep==='mark'){
var key=selE.id+'_'+today;var rec=R[key];
h+='<div style="padding:24px 20px;text-align:center">'+
'<div style="font-size:14px;color:#7d8590;margin-bottom:6px">'+bn()+'</div>'+
'<div class="df" style="font-size:36px;font-weight:700;margin-bottom:4px;color:#e6edf3">'+timeNow()+'</div>'+
'<div style="color:#00d4aa;font-size:13px;margin-bottom:30px">📍 Geo-fence: '+S.radius+'m</div>';
if(rec){var col=rec.status==='present'?'#10b981':rec.status==='half'?'#fbbf24':'#ff6b6b';
var bg=rec.status==='present'?'#10b98122':rec.status==='half'?'#fbbf2422':'#ff6b6b22';
h+='<div style="padding:24px;border-radius:20px;margin-bottom:20px;background:'+bg+';border:1px solid '+col+'44">'+
'<div style="font-size:48px">'+(rec.status==='present'?'✅':rec.status==='half'?'🕐':'❌')+'</div>'+
'<div style="font-size:18px;font-weight:700;margin-top:8px;color:'+col+'">'+(rec.status==='present'?'Present':rec.status==='half'?'Half Day':'Absent')+'</div>'+
'<div style="color:#7d8590;font-size:13px;margin-top:4px">Ajker attendance deoa hoye geche</div>'+
'<div style="color:#7d8590;font-size:12px;margin-top:6px">In: '+(rec.punchIn||'-')+(rec.punchOut?' | Out: '+rec.punchOut:'')+'</div></div>';
if(!rec.punchOut)h+='<button id="poBtn" class="btn bs" style="border-color:#00d4aa55;color:#00d4aa">👋 Punch Out</button>';
}else{
h+='<button id="mP" class="att-btn" style="background:#10b98122;border:1px solid #10b98144"><div style="font-size:36px">✅</div><div style="font-size:17px;font-weight:700;color:#10b981;margin-top:6px">Present</div><div style="font-size:12px;color:#7d8590;margin-top:2px">Full day hajir</div></button>'+
'<button id="mH" class="att-btn" style="background:#fbbf2422;border:1px solid #fbbf2444"><div style="font-size:36px">🕐</div><div style="font-size:17px;font-weight:700;color:#fbbf24;margin-top:6px">Half Day</div><div style="font-size:12px;color:#7d8590;margin-top:2px">Adha din</div></button>';}
h+='</div>';
}

app.innerHTML=h;
document.getElementById('sBack').onclick=function(){if(sStep==='sel'){mode=null;render();}else{sStep='sel';selE=null;pin='';render();}};
var esBs=document.querySelectorAll('.eS');for(var b=0;b<esBs.length;b++)esBs[b].onclick=function(){var id=this.getAttribute('data-i');for(var j=0;j<E.length;j++)if(E[j].id===id){selE=E[j];break;}sStep='pin';pin='';render();};
var nBs=document.querySelectorAll('.nB');for(var nb=0;nb<nBs.length;nb++)nBs[nb].onclick=function(){var v=this.getAttribute('data-v');if(v==='del')pin=pin.slice(0,-1);else if(pin.length<4)pin=pin+v;render();};
var vB=document.getElementById('vBtn');if(vB)vB.onclick=function(){if(pin.length!==4)return showToast('4 digit PIN deen');if(!selE.pin||selE.pin!==pin){showToast('❌ Wrong PIN!');pin='';render();return;}sStep='mark';render();};
var mP=document.getElementById('mP');if(mP)mP.onclick=function(){doGM('present');};
var mH=document.getElementById('mH');if(mH)mH.onclick=function(){doGM('half');};
var poB=document.getElementById('poBtn');if(poB)poB.onclick=function(){var key=selE.id+'_'+fd();if(R[key]){R[key].punchOut=timeNow();sv();showToast('👋 Punch Out: '+timeNow());render();}};
}

function doGM(status){
if(!navigator.geolocation)return showToast('📍 GPS support nai!');
showToast('📍 Location check hochhe...');
navigator.geolocation.getCurrentPosition(function(p){
var d=geoD({lat:p.coords.latitude,lng:p.coords.longitude},{lat:S.lat,lng:S.lng});
if(d>S.radius){showToast('⛔ Office theke '+Math.round(d)+'m dure! '+S.radius+'m er modhye ashun.');return;}
var key=selE.id+'_'+fd();
R[key]={empId:selE.id,date:fd(),status:status,punchIn:timeNow(),punchOut:'',lat:p.coords.latitude,lng:p.coords.longitude};
sv();showToast(status==='present'?'✅ Present marked!':'🕐 Half Day marked!');render();
},function(){showToast('📍 Phone er Location ON korun!');},{enableHighAccuracy:true,timeout:15000});
}

/* ===== ADMIN ===== */
function rAdmin(){
var today=fd();var h='';
var navH='<nav class="nav">'+
'<button id="n1" class="'+(pg==='dash'?'on':'')+'"><i>📊</i>Home</button>'+
'<button id="n2" class="'+(pg==='att'?'on':'')+'"><i>📋</i>Attend.</button>'+
'<button id="n3" class="'+(pg==='staff'?'on':'')+'"><i>👥</i>Staff</button>'+
'<button id="n4" class="'+(pg==='salary'?'on':'')+'"><i>💰</i>Salary</button>'+
'<button id="n5" class="'+(pg==='set'?'on':'')+'"><i>⚙️</i>Settings</button></nav>';

if(pg==='dash'){
var recs=[];for(var k in R)if(R[k].date===today)recs.push(R[k]);
var pr=0,hf=0;for(var r=0;r<recs.length;r++){if(recs[r].status==='present')pr++;else if(recs[r].status==='half')hf++;}
var ab=Math.max(0,E.length-pr-hf);
h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div>'+
'<h1 class="df" style="font-size:22px;margin-bottom:2px;color:#e6edf3">Ascent Digital Creation</h1>'+
'<p style="color:#7d8590;font-size:12px">'+bn()+'</p></div>'+
'<button id="bk" class="btn bs" style="width:auto;padding:6px 12px;font-size:12px">← Back</button></div>'+
'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">'+
'<div style="background:#00d4aa22;border-radius:14px;padding:16px;border:1px solid #00d4aa33"><div style="font-size:28px;font-weight:700;color:#00d4aa">'+E.length+'</div><div style="font-size:12px;color:#7d8590">Staff</div></div>'+
'<div style="background:#10b98122;border-radius:14px;padding:16px;border:1px solid #10b98133"><div style="font-size:28px;font-weight:700;color:#10b981">'+pr+'</div><div style="font-size:12px;color:#7d8590">Present</div></div>'+
'<div style="background:#fbbf2422;border-radius:14px;padding:16px;border:1px solid #fbbf2433"><div style="font-size:28px;font-weight:700;color:#fbbf24">'+hf+'</div><div style="font-size:12px;color:#7d8590">Half Day</div></div>'+
'<div style="background:#ff6b6b22;border-radius:14px;padding:16px;border:1px solid #ff6b6b33"><div style="font-size:28px;font-weight:700;color:#ff6b6b">'+ab+'</div><div style="font-size:12px;color:#7d8590">Absent</div></div></div>';
h+='<div class="card"><h3 style="font-size:15px;margin-bottom:12px;color:#e6edf3">📋 Ajker Status</h3>';
if(E.length===0)h+='<p style="color:#7d8590;font-size:13px">Staff tab e employee add korun</p>';
else for(var i=0;i<E.length;i++){var e=E[i];var rec=R[e.id+'_'+today];
var st=rec?(rec.status==='present'?'✅':rec.status==='half'?'🕐':'❌'):'⏳';
h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;'+(i<E.length-1?'border-bottom:1px solid #30363d':'')+'"><div><div style="font-size:14px;font-weight:500;color:#e6edf3">'+e.name+'</div>'+
'<div style="color:#7d8590;font-size:11px">'+(rec?'In: '+(rec.punchIn||'-')+' | Out: '+(rec.punchOut||'-'):'Not marked')+'</div></div><span style="font-size:16px">'+st+'</span></div>';}
h+='</div>';
}
else if(pg==='att'){
h+='<h2 class="df" style="font-size:20px;margin-bottom:16px;color:#e6edf3">📋 Attendance Register</h2>'+
'<input type="date" id="aD" value="'+attD+'"><div class="card">';
if(E.length===0)h+='<p style="color:#7d8590">Staff add korun</p>';
else for(var i=0;i<E.length;i++){var e=E[i];var key2=e.id+'_'+attD;var rec=R[key2];
h+='<div style="padding:12px 0;'+(i<E.length-1?'border-bottom:1px solid #30363d':'')+';display:flex;justify-content:space-between;align-items:center">'+
'<div style="font-size:14px;font-weight:500;color:#e6edf3">'+e.name+'</div><div style="display:flex;gap:6px">';
var ts=['present','half','absent'];for(var t=0;t<ts.length;t++){var ty=ts[t];var ac=rec&&rec.status===ty;
var col=ty==='present'?'#10b981':ty==='half'?'#fbbf24':'#ff6b6b';
var bg2=ac?(ty==='present'?'#10b98122':ty==='half'?'#fbbf2422':'#ff6b6b22'):'transparent';
var lb=ty==='present'?'✅P':ty==='half'?'🕐H':'❌A';
h+='<button data-e="'+e.id+'" data-d="'+attD+'" data-t="'+ty+'" class="aM" style="padding:6px 10px;font-size:11px;border-radius:8px;cursor:pointer;border:'+(ac?'2px solid '+col:'1px solid #30363d')+';background:'+bg2+';color:'+col+'">'+lb+'</button>';}
h+='</div></div>';}
h+='</div>';
}
else if(pg==='staff'){
h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
'<h2 class="df" style="font-size:20px;color:#e6edf3">👥 Staff ('+E.length+')</h2>'+
'<button id="addE" class="btn bp" style="width:auto;padding:8px 16px;font-size:13px">+ Add</button></div><div id="eFA"></div>';
for(var i=0;i<E.length;i++){var e=E[i];
h+='<div style="background:#161b22;border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid #30363d;display:flex;justify-content:space-between;align-items:center">'+
'<div><div style="font-size:15px;font-weight:500;color:#e6edf3">'+e.name+'</div>'+
'<div style="color:#7d8590;font-size:12px">📱'+(e.phone||'-')+' | '+(e.salaryType==='monthly'?'₹'+e.salary+'/mo':'₹'+e.dailyRate+'/day')+' | PIN:'+(e.pin||'-')+'</div></div>'+
'<div style="display:flex;gap:8px"><button data-e="'+e.id+'" class="edE" style="background:none;border:none;font-size:16px;cursor:pointer">✏️</button>'+
'<button data-e="'+e.id+'" class="dlE" style="background:none;border:none;font-size:16px;cursor:pointer">🗑️</button></div></div>';}
if(E.length===0)h+='<p style="color:#7d8590;text-align:center;margin-top:40px">+ Add button e staff add korun</p>';
}
else if(pg==='salary'){
var wd=dim(salY,salM)-csun(salY,salM);
var mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var mO='',yO='';for(var i=0;i<mn.length;i++)mO+='<option value="'+i+'"'+(i===salM?' selected':'')+'>'+mn[i]+'</option>';
for(var yr=2024;yr<=2027;yr++)yO+='<option value="'+yr+'"'+(yr===salY?' selected':'')+'>'+yr+'</option>';
h+='<h2 class="df" style="font-size:20px;margin-bottom:16px;color:#e6edf3">💰 Salary Report</h2>'+

'<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#e6edf3">'+dim(salY,salM)+'</div><div style="font-size:10px;color:#7d8590">Total</div></div>'+

var total=0;
for(var i=0;i<E.length;i++){var e=E[i];var pr2=0,hf2=0,ab2=0;var td=new Date();
for(var d=1;d<=dim(salY,salM);d++){if(new Date(salY,salM,d).getDay()===0)continue;
var dt=salY+'-'+String(salM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var rec2=R[e.id+'_'+dt];

else if(new Date(salY,salM,d)<td)ab2++;}
var eff=pr2+hf2*0.5;var sal2=e.salaryType==='monthly'?Math.round((e.salary/(wd||1))*eff):Math.round(e.dailyRate*eff);total+=sal2;

if(E.length>0)h+='<div style="background:#00d4aa22;border-radius:14px;padding:16px;border:1px solid #00d4aa44;text-align:center">'+
'<div style="color:#7d8590;font-size:13px">Total Monthly Payout</div>'+
'<div style="color:#00d4aa;font-size:28px;font-weight:700">₹'+total.toLocaleString('en-IN')+'</div></div>';
}
else if(pg==='set'){
h+='<h2 class="df" style="font-size:20px;margin-bottom:16px;color:#e6edf3">⚙️ Settings</h2>'+

'<p style="color:#7d8590;font-size:11px;margin-top:16px;text-align:center;line-height:1.7">Staff der ei website er link share korun<br>Ora "Staff Attendance" mode select korbe<br>PIN diye geo-fenced attendance dibe</p>';
}

document.getElementById('n1').onclick=function(){pg='dash';render();};

var eid=this.getAttribute('data-e'),dt=this.getAttribute('data-d'),ty=this.getAttribute('data-t');
R[eid+'_'+dt]={empId:eid,date:dt,status:ty,punchIn:'Manual',punchOut:''};sv();showToast(ty+' ✅');render();};

var addE=document.getElementById('addE');if(addE)addE.onclick=function(){eId=null;showEF();};

var dlBs=document.querySelectorAll('.dlE');for(var db=0;db<dlBs.length;db++)dlBs[db].onclick=function(){

var sYE=document.getElementById('sY');if(sYE)sYE.onchange=function(){salY=parseInt(this.value);render();};

var scL=document.getElementById('scL');if(scL)scL.onclick=function(){
if(!navigator.geolocation)return showToast('GPS nai!');showToast('📍 Getting location...');
navigator.geolocation.getCurrentPosition(function(p){S.lat=p.coords.latitude;S.lng=p.coords.longitude;sv();showToast('📍 Office location set!');render();
},function(){showToast('Location access dite hobe!');},{enableHighAccuracy:true});};
var svS=document.getElementById('svS');if(svS)svS.onclick=function(){
S.lat=parseFloat(document.getElementById('sLa').value);S.lng=parseFloat(document.getElementById('sLo').value);

r.onload=function(e){try{var d=JSON.parse(e.target.result);if(d.employees)E=d.employees;if(d.records)R=d.records;
if(d.settings)S=d.settings;sv();showToast('📥 Imported!');render();}catch(er){showToast('File error!')}};r.readAsText(f);};
var clB=document.getElementById('clB');if(clB)clB.onclick=function(){if(confirm('SHOB data delete hobe!!')){E=[];R={};sv();showToast('🗑️ Cleared!');render();}};
}

var e=eId?null:{name:'',phone:'',salaryType:'monthly',salary:'',dailyRate:'',pin:''};

var area=document.getElementById('eFA');if(!area)return;

area.innerHTML='<div class="card" style="border-color:#00d4aa44">'+

document.getElementById('tM').onclick=function(){ftype='monthly';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tD').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fsa').style.display='block';document.getElementById('fda').style.display='none';};
document.getElementById('tD').onclick=function(){ftype='daily';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tM').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fda').style.display='block';document.getElementById('fsa').style.display='none';};
document.getElementById('svE').onclick=function(){
var name=document.getElementById('fn').value.trim(),phone=document.getElementById('fp').value.trim(),pinV=document.getElementById('fpi').value;
var sal=parseFloat(document.getElementById('fsa').value)||0,daily=parseFloat(document.getElementById('fda').value)||0;
if(!name)return showToast('Naam likhun!');if(!pinV||pinV.length!==4)return showToast('4 digit PIN deen!');
if(eId){for(var i=0;i<E.length;i++)if(E[i].id===eId){E[i]={id:eId,name:name,phone:phone,salaryType:ftype,salary:sal,dailyRate:daily,pin:pinV};break;}showToast('✅ Updated!');}
else{E.push({id:Date.now().toString(),name:name,phone:phone,salaryType:ftype,salary:sal,dailyRate:daily,pin:pinV});showToast('✅ Employee added!');}

}

render();
})();
