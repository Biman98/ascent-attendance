}

/* ===== CALC SALARY ===== */
function calcSal(e,y,m){
var totalDays=dim(y,m);
var pr2=0,hf2=0,ab2=0,sun=csun(y,m),td=new Date();
for(var d=1;d<=totalDays;d++){
if(new Date(y,m,d).getDay()===0)continue;
var dt=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
var rec2=R[e.id+'_'+dt];
if(rec2){if(rec2.status==='present')pr2++;else if(rec2.status==='half')hf2++;else ab2++;}
else if(new Date(y,m,d)<=td)ab2++;
}
var adjKey=e.id+'_'+y+'_'+m;
var adj=ADJ[adjKey]||{overtime:0,fine:0};
var ot=parseFloat(adj.overtime)||0;
var fine=parseFloat(adj.fine)||0;
// FIXED: Monthly salary / 30 * effective days (not working days)
var eff=pr2+hf2*0.5;
var base=e.salaryType==='monthly'?Math.round((e.salary/30)*eff):Math.round(e.dailyRate*eff);
var net=base+ot-fine;
return {present:pr2,half:hf2,absent:ab2,effective:eff,base:base,overtime:ot,fine:fine,net:Math.max(0,net),sundays:sun,totalDays:totalDays};
}

// Settings

var svS=document.getElementById('svS');if(svS)svS.onclick=function(){S.lat=parseFloat(document.getElementById('sLa').value);S.lng=parseFloat(document.getElementById('sLo').value);S.radius=parseInt(document.getElementById('sR').value)||200;setRef.set({lat:S.lat,lng:S.lng,radius:S.radius,adminPwd:S.adminPwd},{merge:true}).then(function(){showToast('⚙️ Saved!');});};
var chP=document.getElementById('chPwd');if(chP)chP.onclick=function(){var np=document.getElementById('nPwd').value;if(!np||np.length<4)return showToast('Min 4 char!');S.adminPwd=np;setRef.set({adminPwd:np},{merge:true}).then(function(){showToast('🔐 Changed!');document.getElementById('nPwd').value='';});};
var exB=document.getElementById('exB');if(exB)exB.onclick=function(){var d=JSON.stringify({employees:E,records:R,adjustments:ADJ,settings:S},null,2),b=new Blob([d],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ascent_backup_'+fd()+'.json';a.click();showToast('📤 Exported!');};
var clB=document.getElementById('clB');if(clB)clB.onclick=function(){if(confirm('SHOB data delete hobe!!')){empRef.get().then(function(s){s.forEach(function(d){d.ref.delete();});});recRef.get().then(function(s){s.forEach(function(d){d.ref.delete();});});adjRef.get().then(function(s){s.forEach(function(d){d.ref.delete();});});E=[];R={};ADJ={};showToast('🗑️ Cleared!');render();}};
}

/* ===== EMPLOYEE FORM ===== */
function showEF(){
var e=eId?null:{name:'',phone:'',salaryType:'monthly',salary:'',dailyRate:'',pin:''};
if(eId){for(var i=0;i<E.length;i++)if(E[i].id===eId){e=E[i];break;}}if(!e)return;
var area=document.getElementById('eFA');if(!area)return;
var ftype=e.salaryType||'monthly';
area.innerHTML='<div class="card" style="border-color:#00d4aa44"><input id="fn" placeholder="Naam" value="'+e.name+'"><input id="fp" placeholder="Phone" value="'+(e.phone||'')+'"><input id="fpi" placeholder="4-digit PIN" maxlength="4" value="'+(e.pin||'')+'"><div style="display:flex;gap:8px;margin-bottom:12px"><button id="tM" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='monthly'?'#00d4aa':'#30363d')+';background:'+(ftype==='monthly'?'#00d4aa22':'transparent')+';color:'+(ftype==='monthly'?'#00d4aa':'#7d8590')+'">📅 Monthly</button><button id="tD" style="flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid '+(ftype==='daily'?'#00d4aa':'#30363d')+';background:'+(ftype==='daily'?'#00d4aa22':'transparent')+';color:'+(ftype==='daily'?'#00d4aa':'#7d8590')+'">📆 Daily</button></div><input id="fsa" type="number" placeholder="Monthly Salary (₹)" value="'+(e.salary||'')+'" style="display:'+(ftype==='daily'?'none':'block')+'"><input id="fda" type="number" placeholder="Daily Rate (₹)" value="'+(e.dailyRate||'')+'" style="display:'+(ftype==='daily'?'block':'none')+'"><div style="display:flex;gap:8px"><button id="svE" class="btn bp">'+(eId?'Update':'Save')+' ✅</button><button id="cnE" class="btn bs" style="width:auto;padding:14px 20px">Cancel</button></div></div>';

document.getElementById('tM').onclick=function(){ftype='monthly';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tD').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fsa').style.display='block';document.getElementById('fda').style.display='none';};
document.getElementById('tD').onclick=function(){ftype='daily';this.style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #00d4aa;background:#00d4aa22;color:#00d4aa';document.getElementById('tM').style.cssText='flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid #30363d;background:transparent;color:#7d8590';document.getElementById('fda').style.display='block';document.getElementById('fsa').style.display='none';};

document.getElementById('svE').onclick=function(){
var name=document.getElementById('fn').value.trim(),phone=document.getElementById('fp').value.trim(),pinV=document.getElementById('fpi').value;
var sal=parseFloat(document.getElementById('fsa').value)||0,daily=parseFloat(document.getElementById('fda').value)||0;
if(!name)return showToast('Naam likhun!');if(!pinV||pinV.length!==4)return showToast('4 digit PIN deen!');
var data={name:name,phone:phone,salaryType:ftype,salary:sal,dailyRate:daily,pin:pinV};
showToast('💾 Saving...');
if(eId){empRef.doc(eId).update(data).then(function(){for(var i=0;i<E.length;i++)if(E[i].id===eId){data.id=eId;E[i]=data;break;}showToast('✅ Updated!');eId=null;render();}).catch(function(){showToast('Error!');});}
else{empRef.add(data).then(function(doc){data.id=doc.id;E.push(data);showToast('✅ Added!');eId=null;render();}).catch(function(){showToast('Error!');});}};
document.getElementById('cnE').onclick=function(){eId=null;render();};
}

loadAll(function(){render();});
})();
</script>
